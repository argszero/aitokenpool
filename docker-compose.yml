# AITokenPool — Docker Compose 一键部署（v0.3.3）
#
# 快速开始：
#   docker compose up -d --build
#   浏览器打开 http://localhost:8080/
#
# ⚠️ 生产环境必须设置 ATP_MASTER_KEY（32 字节 hex 主密钥）：
#   生成：openssl rand -hex 32
#   注入：export ATP_MASTER_KEY=$(openssl rand -hex 32) && docker compose up -d
#   未设置时使用示例默认值（dev 模式，重启后已加密的上游 key 不可解密，仅用于本地试用）。
services:
  aitokenpool:
    build: .
    image: aitokenpool:0.3.3
    ports:
      - "8080:8080"
    volumes:
      # SQLite 数据持久化（config.example.toml 中 db_path = "data/aitokenpool.db"，
      # 容器内 WORKDIR=/，相对路径解析为 /data/aitokenpool.db）
      - ./data:/data
    environment:
      # 主密钥（32 字节 hex；env 优先于 config [server].master_key）
      - ATP_MASTER_KEY=${ATP_MASTER_KEY:-dev-master-key-请替换}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped
