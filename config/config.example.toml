# AITokenPool 配置文件示例
#
# 设计约定（2026-08-13 / 2026-08-20 简化）：
#   - 本文件是「人手工维护」的配置：providers / plans / 点数规则，需要加注释、经常 review。
#   - 模型（厂商/名称/价格/上下文/读图等）全部在下方 [[models]] 段定义（唯一真源，
#     2026-08-20 rant：不再有 data/models.json 聚合源 + price_overrides 覆盖的双层机制）。

# ============================================================
# 0. 服务（监听地址 / 数据库路径）— P0-A 起可配
# ============================================================
[server]
addr = "0.0.0.0:8080"
# 数据库路径由统一数据目录决定（rant 2026-08-19T20:53:23）：<ATP_DATA_DIR>/aitokenpool.db。
# 此处的 db_path 已忽略（保留仅为兼容旧启动方式）。
db_path = "data/aitokenpool.db"
# 平台对外网关地址（不含 /v1 等路径）：设置页「接入方式」端点由此拼接（{public_url}/v1、{public_url}/anthropic）。
# 缺省 http://localhost:8080（dev 默认，与 addr 解耦——addr 是监听地址，public_url 是对外可达地址）。
# ⚠️ 生产必须设为真实域名（如 https://pool.example.com），否则前端展示的接入端点是错的。
public_url = "https://gateway.example.com"
# 上游 key 主密钥（P0-C 起）：hex 32 字节；env ATP_MASTER_KEY 优先级更高。
# ⚠️ 生产必须显式配置（env 或此处），否则使用随机 dev 密钥 —— 重启后旧密文不可解，
#    所有已上架 key 将解密失败（503）。生成：openssl rand -hex 32
# master_key = "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"

# ============================================================
# 0.1 邮件服务（注册验证码，rant 2026-08-19T14:36:19 方案 B）
#     未配置时进入 dev 模式：验证码打印到日志/响应（便于本地测试）。
#     ⚠️ 生产部署必须配置 SMTP（本实现用 implicit TLS → 端口 465，如 smtp.gmail.com:465），
#     否则验证码邮件不会真正送达。
# ============================================================
# [mail]
# smtp_host = "smtp.example.com"
# smtp_port = 465
# smtp_user = "noreply@example.com"
# smtp_password = "your-smtp-password"
# from = "noreply@example.com"
# from_name = "AITokenPool"
# verify_subject = "AITokenPool 邮箱验证码"

# ============================================================
# 0.2 日志（rant 2026-08-19T20:54:26）：文件输出 + 按大小滚动 + 自动清理旧日志
#     文件在 <ATP_DATA_DIR>/logs/（stdout 同时保留，双写）。
# ============================================================
[log]
dir = "logs"                        # 相对数据目录
level = "info"                      # trace | debug | info | warn | error
file_pattern = "aitokenpool.{}.log" # 滚动文件命名（{} 为序号）
max_file_size = 10_000_000          # 触发滚动的单文件大小（bytes，10MB）
max_backups = 7                     # 保留最近 7 个滚动文件（自动删除更旧）

# ============================================================
# 0.3 交易明细归档（rant 2026-10-09T12:28:58）：明细写可滚动、有保留期的
#     JSONL 文件，从文件查看即可。SQLite 侧只留保留窗口内的明细与汇总（见 §0.4 [rollup]）。
#     文件在 <ATP_DATA_DIR>/archive/transactions-<序号>.jsonl，每行一个事务。
# ============================================================
[archive]
enabled = true                      # 是否启用归档（默认 true）
dir = "archive"                     # 相对数据目录
max_file_size = 50_000_000          # 单文件滚动阈值（bytes，50MB）
max_files = 10                      # 保留最近 10 个文件（更旧的删除）
batch = 2_000                       # 每轮最多归档多少行（越小 → 单次持库时间越短）
interval_secs = 60                  # 归档扫描间隔（秒）

# ============================================================
# 0.4 交易明细汇总（rant 2026-10-09T12:28:58）：把明细折叠成**可加**汇总行 ——
#     维度 = 类型 + 用户 + 模型 + key + 状态 + 时间（分钟级），可加量 = 点数与各
#     token 的 SUM + 行数。汇总只折叠**已归档**的明细（id ≤ [archive] 水位），
#     于是删掉已折叠的明细永远不丢原件。故 [archive] 关掉时汇总不前进。
# ============================================================
[rollup]
enabled = true                      # 是否启用折叠（默认 true）
batch = 2_000                       # 每轮最多折叠多少条明细（越小 → 单次持库时间越短）
interval_secs = 60                  # 折叠扫描间隔（秒）
retain_minutes = 10                 # 明细保留窗口（**分钟**，默认 10）：早于 now-retain_minutes
                                    # 的已折叠明细每轮删一批。窗口外的明细不丢 —— 交易页读读模型
                                    # tx_facts，它们以分钟汇总行呈现（一行代表 N 条）。
                                    # 0 = 不留明细（只留汇总），交易页上每一行都是汇总行。
                                    # 旧拼写 retain_days（天）仍认且**优先** —— 新配置用本键。

# ============================================================
# 0.5 用量明细保留（rant 2026-10-09T12:28:58 的独立余项）：`usage_records` 是同一笔
#     settle 写的第二张只增不减的明细表。它的读者全是写死的月/日窗口 ⇒ **不需要折叠**，
#     只需「先归档、再按日历窗口删」。归档落在 [archive] 目录的 usage/ 子目录
#     （水位文件同名，靠目录隔离）。保留窗口**没有配置项**：门槛是读者的同一套日历谓词
#     `date('now','start of month','-1 month')`（保留本月 + 上月），
#     `usage_retention_gate` 守着「门槛 ≤ 每个读者的下界」。故 [archive] 关掉时一行不删。
# ============================================================
[usage_retention]
enabled = true                      # 是否启用（默认 true）
batch = 2_000                       # 每轮最多删多少行（越小 → 单次持库时间越短）
interval_secs = 60                  # 扫描间隔（秒）

# ============================================================
# 1. 点数规则（账本层的锚）
# ============================================================
[points]
# 货币锚：USD | CNY。国内厂商报人民币、国际报美元，统一折算到锚定货币。
# 锚定 CNY：DeepSeek 等国内模型直接按官方 CNY 价计点（1 点 ≈ 1 元），
# 国际厂商（claude/gpt 等 USD 价）按 7.2 汇率折算成 CNY 后计点。
anchor_currency = "CNY"

# 点数粒度：1 CNY = 1 点（点数可为小数，账本与展示最多保留 5 位小数）。
# 例：某模型输出价 4.5 元/M → 消费 0.0000045 点/token。
points_per_unit = 1

# 显示名与最小单位（仅用于 UI 展示，不参与账本计算）
display_name = "点数"
symbol = "P"

# ============================================================
# 1.1 计费规则（rant 2026-10-16T14:08:13）：高峰时段判定里的「哪几天」
#     DeepSeek 官方口径（api-docs.deepseek.com，2026-10-16 核实）：
#     高峰 = 北京时间**周一至周五（不含中国法定节假日）** 9:00-12:00、14:00-18:00；
#     其余时段 —— **包括周末及中国法定节假日全天** —— 均为空闲时段
#     （空闲价 = 高峰价的一半）。
#     周末由代码判定；法定节假日靠下表（全仓没有内置日历，也不按「调休上班」反推）。
#     表按官方年度放假安排维护（国务院办公厅每年发布），日期为北京时间的 YYYY-MM-DD。
#     ⚠️ 未列出即不豁免：跨年忘记更新只会少豁免几天，不会算错价、不会启动失败；
#        写错格式（不是日期）在启动解析配置时报错。
# ============================================================
[billing]
# 法定节假日（北京时间的日期）；留空 = 只豁免周末。
holidays = []
# 例：holidays = ["2026-01-01", "2026-05-01"]

