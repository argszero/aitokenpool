# ============================================================
# 4. 模型目录（rant 2026-08-20T10:27:13：config 唯一真源）
#    模型（厂商/名称/价格/上下文/读图等）全部在此定义；启动时 upsert 进 DB。
#    单位：每百万 tokens（currency 对应币种）；input_per_m = 缓存未命中输入价，
#    cache_hit_input_per_m = 缓存命中输入价（缺省 0 = 命中免费）。
#    缓存写入价（rant 2026-10-16T14:08:14）：可选 cache_write_input_per_m（每百万 tokens），
#    缺省 0 = 缓存写入不收费（与今天一致）。⚠️ 这个字段目前**只表达、不收费**：上游响应里
#    没有取「缓存写入 token 数」的通路（gateway parse_usage / sse 都不产出它），接进计费要
#    另加一次用量解析，属后续改动。
#    分档价（rant 2026-10-16T14:08:14 第 2 步：settle 已按请求输入 token 数选档）：
#    可选 [[models.tiers]] 数组按**单次请求输入 token 数**分档 —— 输入 = 缓存未命中 ＋ 缓存
#    命中那一段 prompt（不是用户累计用量，也不是输出）。from_tokens 是本档下界（含），各档
#    from_tokens 必须 > 0 且严格递增；模型自身的 input_per_m 等是 from_tokens 之前的第一档。
#    官方写法若是开区间（如 MiniMax 的「输入 >512k」），把边界 +1 写进 from_tokens（512001）。
#    ⚠️ [[models.tiers]] 必须写在所属 [[models]] 的**最后**（TOML：子表头之后不能再给父表加键）。
#    例：
#      [[models.tiers]]
#      from_tokens = 512001
#      input_per_m = 4.20
#      cache_hit_input_per_m = 0.84
#      output_per_m = 16.80
#    ⛔ 档位数据只填官网确实给了的：本仓 config 是唯一真源（src/db.rs::seed_models），填错即错账。
#    ⚠️ 已填长档的（官网核实，见各行注释）：minimax-m3（>512k）、gemini-3.1-pro、grok-4.6、
#    grok-4.7（后三家都是 >200k）。未填的一律是「官网**没给这个数**」，不是漏了：
#    qwen3.7-flash（分档只公布输入/输出两列、缓存命中价未公布 ⇒ 补档会把命中价打成 0 少收）、
#    OpenAI 各家（分了短/长两段，但**没公布分界 token 数**）、Claude（价格页无长档一段）—— 待补。
#    高峰时段价（rant 2026-08-20T11:58:40）：peak_input_per_m / peak_output_per_m /
#    peak_cache_hit_input_per_m 三个可选字段，缺省 0 = 不启用高峰计费（沿用空闲价）。
#    命中高峰时段（北京时间 9-12、14-18，**周一至周五**且不在 [billing] holidays 内）
#    时按高峰价扣点（rant 2026-10-16T14:08:13：周末与法定节假日全天按空闲价）。
#    DeepSeek 为官方价（2026-09-14 浏览器核实，https://api-docs.deepseek.com/zh-cn/quick_start/pricing）：
#    空闲价即高峰价的一半，高峰 9-12/14-18 北京时翻倍（flash 2.0/0.04/8.0，pro 9.0/0.30/27.0 元/M）。
#    模型名同样以官方文档为准：V4.1-Flash 的模型名是 `deepseek-flash`（V4 Flash 与 V4 Flash-Vision-Exp
#    已下线，旧名请求被官方路由到 V4.1-Flash 并按 Flash 价计费 ⇒ 目录中不再单列那两个旧名）。
# ============================================================

[[models]]
provider = "deepseek"
model = "deepseek-flash"
currency = "CNY"
input_per_m = 1.0
cache_hit_input_per_m = 0.02
output_per_m = 4.0
# 高峰时段价（北京 9-12 / 14-18 翻倍；官方价）
peak_input_per_m = 2.0
peak_cache_hit_input_per_m = 0.04
peak_output_per_m = 8.0
context_length = 1048576
max_output = 384000
# DeepSeek-V4.1-Flash 原生多模态（官方「图像理解：支持」）⇒ 旧 vision-exp 条目已并入本条
vision = true

[[models]]
provider = "deepseek"
model = "deepseek-v4-pro"
currency = "CNY"
input_per_m = 4.5
cache_hit_input_per_m = 0.15
output_per_m = 13.5
# 高峰时段价（北京 9-12 / 14-18 翻倍；官方价）
peak_input_per_m = 9.0
peak_cache_hit_input_per_m = 0.30
peak_output_per_m = 27.0
context_length = 1048576
max_output = 384000
vision = false

[[models]]
provider = "zhipu"
model = "glm-5.3"
currency = "CNY"
input_per_m = 8.0
cache_hit_input_per_m = 2.0
output_per_m = 28.0
context_length = 1048576
max_output = 131072
vision = false

[[models]]
provider = "zhipu"
model = "glm-5.3-flash"
# 官网价（2026-10-16 核实，https://docs.bigmodel.cn/）：0.8 / 缓存命中 0.23 / 2.8 元每百万 tokens；
# 另有「限时五折」0.4 / 0.115 / 1.4（本条记表列值）。1M 上下文、原生多模态
# —— rant 2026-10-16T15:20:36.482297
currency = "CNY"
input_per_m = 0.8
