# AITokenPool 配置文件示例
#
# 设计约定（2026-08-13 / 2026-08-20 简化）：
#   - 本文件是「人手工维护」的配置：providers / plans / 点数规则，需要加注释、经常 review。
#   - 模型（厂商/名称/价格/上下文/读图等）全部在下方 [[models]] 段定义（唯一真源，
#     2026-08-20 rant：不再有 data/models.json 聚合源 + price_overrides 覆盖的双层机制）。

# ============================================================
# 0. 服务（监听地址 / 数据库路径）— P0-A 起可配
# ============================================================
[server]
addr = "0.0.0.0:8080"
# 数据库路径由统一数据目录决定（rant 2026-08-19T20:53:23）：<ATP_DATA_DIR>/aitokenpool.db。
# 此处的 db_path 已忽略（保留仅为兼容旧启动方式）。
db_path = "data/aitokenpool.db"
# 平台对外网关地址（不含 /v1 等路径）：设置页「接入方式」端点由此拼接（{public_url}/v1、{public_url}/anthropic）。
# 缺省 http://localhost:8080（dev 默认，与 addr 解耦——addr 是监听地址，public_url 是对外可达地址）。
# ⚠️ 生产必须设为真实域名（如 https://pool.example.com），否则前端展示的接入端点是错的。
public_url = "https://gateway.example.com"
# 上游 key 主密钥（P0-C 起）：hex 32 字节；env ATP_MASTER_KEY 优先级更高。
# ⚠️ 生产必须显式配置（env 或此处），否则使用随机 dev 密钥 —— 重启后旧密文不可解，
#    所有已上架 key 将解密失败（503）。生成：openssl rand -hex 32
# master_key = "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"

# ============================================================
# 0.1 邮件服务（注册验证码，rant 2026-08-19T14:36:19 方案 B）
#     未配置时进入 dev 模式：验证码打印到日志/响应（便于本地测试）。
#     ⚠️ 生产部署必须配置 SMTP（STARTTLS，默认 587），否则验证码邮件不会真正送达。
# ============================================================
# [mail]
# smtp_host = "smtp.example.com"
# smtp_port = 587
# smtp_user = "noreply@example.com"
# smtp_password = "your-smtp-password"
# from = "noreply@example.com"
# from_name = "AITokenPool"
# verify_subject = "AITokenPool 邮箱验证码"

# ============================================================
# 0.2 日志（rant 2026-08-19T20:54:26）：文件输出 + 按大小滚动 + 自动清理旧日志
#     文件在 <ATP_DATA_DIR>/logs/（stdout 同时保留，双写）。
# ============================================================
[log]
dir = "logs"                        # 相对数据目录
level = "info"                      # trace | debug | info | warn | error
file_pattern = "aitokenpool.{}.log" # 滚动文件命名（{} 为序号）
max_file_size = 10_000_000          # 触发滚动的单文件大小（bytes，10MB）
max_backups = 7                     # 保留最近 7 个滚动文件（自动删除更旧）

# ============================================================
# 1. 点数规则（账本层的锚）
# ============================================================
[points]
# 货币锚：USD | CNY。国内厂商报人民币、国际报美元，统一折算到锚定货币。
# 锚定 CNY：DeepSeek 等国内模型直接按官方 CNY 价计点（1 点 ≈ 1 元），
# 国际厂商（claude/gpt 等 USD 价）按 7.2 汇率折算成 CNY 后计点。
anchor_currency = "CNY"

# 点数粒度：1 CNY = 1 点（点数可为小数，账本与展示最多保留 5 位小数）。
# 例：DeepSeek Flash 输出 4.5 元/M → 消费 0.0000045 点/token。
points_per_unit = 1

# 显示名与最小单位（仅用于 UI 展示，不参与账本计算）
display_name = "点数"
symbol = "P"

# ============================================================
# 2. 提供商（providers）
#    一个 provider = 一家模型厂商，可有多套 plan 端点。
# ============================================================

# —— 协议枚举约定（网关层适配器）——
#   openai_chat  = OpenAI Chat Completions（POST /chat/completions）
#   anthropic    = Anthropic Messages（POST /v1/messages）
#   responses    = OpenAI Responses（POST /responses）— P0 后置

[[providers]]
id = "deepseek"
name = "DeepSeek"
country = "CN"

[[providers]]
id = "zhipu"
name = "智谱 GLM"
country = "CN"

[[providers]]
id = "aliyun-bailian"
name = "阿里云百炼"
country = "CN"

[[providers]]
id = "bytedance-ark"
name = "火山方舟（豆包）"
country = "CN"

[[providers]]
id = "moonshot"
name = "Kimi（月之暗面）"
country = "CN"

[[providers]]
id = "minimax"
name = "MiniMax"
country = "CN"

# ============================================================
# 3. Plan 端点（plans）
#    每个 plan = 一个可被路由到的上游端点（协议 + base_url）。
# ============================================================

[[plans]]
id = "deepseek-paygo"
provider = "deepseek"
type = "paygo"                 # paygo | token | coding
endpoints = [
  { protocol = "openai_chat", base_url = "https://api.deepseek.com" },
  { protocol = "anthropic",   base_url = "https://api.deepseek.com/anthropic" },
  { protocol = "responses",   base_url = "https://api.deepseek.com" },   # P0 后置
]

[[plans]]
id = "zhipu-coding"
provider = "zhipu"
type = "coding"
endpoints = [
  { protocol = "openai_chat", base_url = "https://open.bigmodel.cn/api/coding/paas/v4" },
  { protocol = "anthropic",   base_url = "https://open.bigmodel.cn/api/anthropic" },
]

[[plans]]
id = "aliyun-token-plan"
provider = "aliyun-bailian"
type = "token"
# 注意：仅限交互式编程工具，禁止自动化批量调用（合规约束）
interactive_only = true
endpoints = [
  { protocol = "openai_chat", base_url = "https://token-plan.cn-beijing.maas.aliyuncs.com/compatible-mode/v1" },
  { protocol = "anthropic",   base_url = "https://token-plan.cn-beijing.maas.aliyuncs.com/apps/anthropic" },
]

[[plans]]
id = "ark-coding"
provider = "bytedance-ark"
type = "coding"
endpoints = [
  { protocol = "openai_chat", base_url = "https://ark.cn-beijing.volces.com/api/coding/v3" },
  { protocol = "anthropic",   base_url = "https://ark.cn-beijing.volces.com/api/coding" },
]

[[plans]]
id = "ark-agent"
provider = "bytedance-ark"
type = "token"
endpoints = [
  { protocol = "openai_chat", base_url = "https://ark.cn-beijing.volces.com/api/plan/v3" },
  { protocol = "anthropic",   base_url = "https://ark.cn-beijing.volces.com/api/plan" },
]

[[plans]]
id = "kimi-code"
provider = "moonshot"
type = "coding"
endpoints = [
  { protocol = "openai_chat", base_url = "https://api.kimi.com/coding/v1" },
  { protocol = "anthropic",   base_url = "https://api.kimi.com/coding/" },
]

[[plans]]
id = "minimax-coding"
provider = "minimax"
type = "coding"
endpoints = [
  # 国内站（国际站用 api.minimax.io）
  { protocol = "openai_chat", base_url = "https://api.minimaxi.com/v1" },
  { protocol = "anthropic",   base_url = "https://api.minimaxi.com/anthropic" },
]

# —— 按量付费（paygo）Plan：每家厂商至少一个「API（按量）」项（上架表单 Plan 下拉）——
#    deepseek-paygo 见上；以下补齐 智谱 / 阿里云百炼 / 火山方舟 / Kimi / MiniMax

[[plans]]
id = "zhipu-paygo"
provider = "zhipu"
type = "paygo"
endpoints = [
  { protocol = "openai_chat", base_url = "https://open.bigmodel.cn/api/paas/v4" },
  { protocol = "anthropic",   base_url = "https://open.bigmodel.cn/api/anthropic" },
]

[[plans]]
id = "aliyun-bailian-paygo"
provider = "aliyun-bailian"
type = "paygo"
endpoints = [
  { protocol = "openai_chat", base_url = "https://dashscope.aliyuncs.com/compatible-mode/v1" },
]

[[plans]]
id = "ark-paygo"
provider = "bytedance-ark"
type = "paygo"
endpoints = [
  { protocol = "openai_chat", base_url = "https://ark.cn-beijing.volces.com/api/v3" },
]

[[plans]]
id = "moonshot-paygo"
provider = "moonshot"
type = "paygo"
endpoints = [
  { protocol = "openai_chat", base_url = "https://api.moonshot.cn/v1" },
]

[[plans]]
id = "minimax-paygo"
provider = "minimax"
type = "paygo"
endpoints = [
  { protocol = "openai_chat", base_url = "https://api.minimaxi.com/v1" },
]

# ============================================================
# 4. 模型目录（rant 2026-08-20T10:27:13：config 唯一真源）
#    模型（厂商/名称/价格/上下文/读图等）全部在此定义；启动时 upsert 进 DB。
#    单位：每百万 tokens（currency 对应币种）；input_per_m = 缓存未命中输入价，
